<head>
  <meta charset="utf-8" />
  <!-- fills the whole phone screen, and stops iOS zooming on a double tap -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Spacial Discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Press Start 2P', monospace; box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }

    #panel {
      display: none;
      position: fixed;
      top: 40px; left: 40px; right: 40px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      background: #fff;
      border: 4px solid #000;
      padding: 16px;
      font-size: 11px;
    }
    #panel h2 { font-size: 13px; margin: 0 0 14px; }
    #panel h2 em { font-style: normal; color: #777; font-size: 9px; margin-left: 10px; }

    /* as many covers as fit, however wide the window is */
    #panel ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 18px 14px;
    }
    #panel .film { display: flex; flex-direction: column; gap: 3px; }
    #panel .film a { text-decoration: none; color: #000; }
    #panel .art {
      width: 100%;
      aspect-ratio: 182 / 268; /* IMDb's poster crop. Holds the grid steady while covers load */
      object-fit: cover;
      background: #ddd;
      border: 2px solid #000;
      margin-bottom: 5px;
      display: block;
      font-size: 8px;
    }
    /* no cover to point at: same box, title in the middle of it */
    #panel .art.none {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      color: #888;
      line-height: 1.6;
    }
    #panel .film b { font-size: 10px; line-height: 1.5; }
    #panel .film span { font-size: 8px; line-height: 1.6; color: #666; }

    #panel > small { display: block; margin-top: 16px; color: #777; font-size: 9px; }

    /* --- touch controls, phones and tablets only --------------------------- */
    #pad { display: none; }

    @media (pointer: coarse) {
      #pad {
        display: block;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 0 20px calc(20px + env(safe-area-inset-bottom)) 20px;
        pointer-events: none; /* only the buttons themselves take taps */
        touch-action: none;   /* no scrolling or double-tap zoom on the pad */
        user-select: none;
        -webkit-user-select: none;
      }
      #pad button {
        pointer-events: auto;
        width: 64px; height: 64px;
        /* Press Start 2P is basic latin only — it has no arrows to draw, so the
           pad is the one place that opts out of the pixel font */
        font-family: system-ui, sans-serif;
        font-size: 22px;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        border: 3px solid rgba(255, 255, 255, 0.75);
        border-radius: 10px;
        padding: 0;
      }
      #pad button:active { background: rgba(255, 255, 255, 0.6); color: #000; }

      #pad .dpad {
        display: grid;
        grid-template-columns: repeat(3, 64px);
        gap: 8px;
        width: max-content;
      }
      #pad .dpad [data-dir="up"] { grid-area: 1 / 2; }
      #pad .dpad [data-dir="left"] { grid-area: 2 / 1; }
      #pad .dpad [data-dir="right"] { grid-area: 2 / 3; }
      #pad .dpad [data-dir="down"] { grid-area: 3 / 2; }

      #pad .act {
        position: absolute;
        right: 20px;
        bottom: calc(40px + env(safe-area-inset-bottom));
        width: 80px; height: 80px;
        border-radius: 50%;
      }

      /* keep the last row of covers clear of the pad */
      #panel { padding-bottom: 140px; }
      #prompt { bottom: 232px; }
    }

    #prompt {
      display: none;
      position: fixed;
      bottom: 32px; left: 0; right: 0;
      text-align: center;
      color: #fff;
      font-size: 12px;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }
  </style>
</head>

<div id="game"></div>
<div id="panel"></div>
<div id="prompt"></div>

<!-- touch controls. Last in the document so they paint over the panel, which
     is how the button can also close it. Hidden unless the pointer is coarse -->
<div id="pad">
  <div class="dpad">
    <button data-dir="up" aria-label="walk up">▲</button>
    <button data-dir="left" aria-label="walk left">◀</button>
    <button data-dir="right" aria-label="walk right">▶</button>
    <button data-dir="down" aria-label="walk down">▼</button>
  </div>
  <button class="act" aria-label="browse or close">●</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<script src="data/movies.js"></script>

<script src="js/panel.js"></script>
<script src="js/touch.js"></script>
<script src="js/walk-scene.js"></script>

<!-- one file per place; each is a Phaser scene extending WalkScene -->
<script src="scenes/island.js"></script>
<script src="scenes/video-store.js"></script>

<script src="main.js"></script>
