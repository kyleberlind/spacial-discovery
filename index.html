<head>
  <title>Spacial Discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Press Start 2P', monospace; box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }

    #panel {
      display: none;
      position: fixed;
      top: 40px; left: 40px;
      width: 420px;
      background: #fff;
      border: 4px solid #000;
      padding: 16px;
      line-height: 1.9;
      font-size: 11px;
    }
    #panel h2 { font-size: 13px; margin: 0 0 12px; }
    #panel ul { margin: 0; padding-left: 18px; }
    #panel small { display: block; margin-top: 14px; color: #777; font-size: 9px; }

    #prompt {
      display: none;
      position: fixed;
      bottom: 32px; left: 0; right: 0;
      text-align: center;
      color: #fff;
      font-size: 12px;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }
  </style>
</head>

<div id="game"></div>
<div id="panel"></div>
<div id="prompt"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<script src="data/island-collisions.js"></script>
<script src="data/movies.js"></script>

<script src="js/panel.js"></script>
<script src="js/walk-scene.js"></script>

<!-- one file per place; each is a Phaser scene extending WalkScene -->
<script src="scenes/island.js"></script>
<script src="scenes/video-store.js"></script>

<script src="main.js"></script>
